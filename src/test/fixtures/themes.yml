# LumaMenu 主题。布局文件顶层写 theme: <名字> 就固定用它；不写则跟随玩家选择（/lumamenu theme 或布局动作 theme: <名字>），未选时用 default。
# 跟随玩家的布局会为每个非默认主题各编译一份页面（ID 记为 页面~主题）。label 为玩家看到的名字。
# 颜色在任何 color 字段里写 '@名字'（需加引号）。每个主题都从内置 rift 的颜色开始，这里只写要改的。
# 可选装饰色（只在写了的主题里画）：panel-inset 面板内 3 单位处的内框线，header-gem 标题栏线中央的小方块，card-stripe 信息卡左侧 2 单位竖条。
# click-sound：点击菜单按钮时播放的声音，格式同布局动作 sound:（声音ID[-音量[-音调]]）；按钮自己带 sound: 动作时不重复播放；留空为无声。
# corner：images/ 下的路径前缀，面板四角依次用 <前缀>-tl/-tr/-bl/-br.png，空则不画角饰；corner-size 为显示边长（单位）。
default: rift
themes:
  rift:
    label: 界隙
    click-sound: block.amethyst_block.step-0.8-1.2
    corner: theme/rift/corner
    corner-size: 7
    colors:
      panel: '#F8F6FD'
      panel-border: '#8C6CF0'
      panel-glow: '#CDBEFF'
      panel-highlight: '#FFFFFF'
      header: '#EEE8FC'
      header-line: '#C9B9F7'
      title: '#3B2C78'
      text: '#33304A'
      muted: '#8A86A0'
      accent: '#8C6CF0'
      accent-dark: '#6E4BD8'
      accent-light: '#B9A4FF'
      accent-text: '#5B3FC4'
      on-accent: '#FFFFFF'
      button: '#FFFFFF'
      button-border: '#DCD3F5'
      button-shade: '#D9CEF6'
      disabled: '#EFEEF3'
      disabled-border: '#E0DEE8'
      card: '#F1ECFD'
      card-border: '#DCD3F5'
      track: '#E2DAF7'
      slot-empty: '#C9B9F7'
  # 方案 B“法师羊皮纸”：暖白纸面、铜框（外晕深铜 + 描边浅铜）、四角镶紫晶；选中/主按钮用深铜皮革色而非界隙紫。
  parchment:
    label: 羊皮纸
    click-sound: item.book.page_turn-0.8-1
    corner: theme/parchment/corner
    corner-size: 8
    colors:
      panel: '#F4EAD3'
      panel-border: '#C9A66B'
      panel-glow: '#7A5A34'
      panel-highlight: '#F4EAD3'
      header: '#F4EAD3'
      header-line: '#C9A66B'
      title: '#4A3420'
      text: '#4A3B2A'
      muted: '#9A8668'
      accent: '#7A5A34'
      accent-dark: '#5A3F22'
      accent-light: '#D4B47C'
      accent-text: '#7A4E22'
      on-accent: '#FBF3DF'
      button: '#FCF7EA'
      button-border: '#D6C196'
      button-shade: '#E6D7B5'
      disabled: '#EDE5D2'
      disabled-border: '#DDD0B4'
      card: '#FBF5E6'
      card-border: '#D6C196'
      track: '#E6D7B5'
      slot-empty: '#D6C196'
      panel-inset: '#E0CDA2'
      header-gem: '#9B74F0'
