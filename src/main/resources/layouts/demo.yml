schema-version: 3
id: demo
look-down: true
canvas: {width: 452, height: 180}
pages:
  demo:
    title: 光幕菜单
    frontend:
      shell: &shell
        type: group
        children:
          panel: {type: rectangle, width: 444, height: 176, color: '#151A23', offset: {x: 226, y: 90}}
          border: {type: frame, width: 444, height: 176, color: '#2C3442', offset: {x: 226, y: 90, z: 0.01}}
          header: {type: rectangle, width: 442, height: 30, color: '#1C2330', offset: {x: 226, y: 17, z: 0.02}}
          accent: {type: line, width: 442, height: 1, color: '#4F8CFF', offset: {x: 226, y: 32.5, z: 0.03}}
      title: {type: text, content: 光幕菜单, size: 10, color: '#E6EAF2', offset: {x: 226, y: 17, z: 1}}
      status-card: {type: rectangle, width: 236, height: 44, color: '#1C2330', offset: {x: 137, y: 62, z: 0.5}}
      status-label: {type: text, content: 状态, size: 6, color: '#8B95A7', offset: {x: 37, y: 50, z: 1}}
      status:
        type: text
        content: '{status}'
        color: '#E6EAF2'
        line-width: 210
        max-lines: 1
        alignment: left
        offset: {x: 137, y: 66, z: 1}
      diamond-slot:
        type: group
        offset: {x: 324, y: 62, z: 0.5}
        children:
          well: {type: rectangle, width: 42, height: 42, color: '#0F141C'}
          rim: {type: frame, width: 42, height: 42, color: '#2C3442', offset: {z: 0.01}}
      grass-slot:
        type: group
        offset: {x: 384, y: 62, z: 0.5}
        children:
          well: {type: rectangle, width: 42, height: 42, color: '#0F141C'}
          rim: {type: frame, width: 42, height: 42, color: '#2C3442', offset: {z: 0.01}}
      diamond:
        type: item
        source: minecraft:diamond
        width: 28
        height: 28
        tooltip: 原版物品
        offset: {x: 324, y: 62, z: 2}
      grass:
        type: block
        source: minecraft:grass_block
        width: 26
        height: 26
        rotation: {x: 20, y: -30}
        tooltip: 立体方块
        offset: {x: 384, y: 62, z: 2}
      ping:
        type: button
        content: 测试回调
        color: '#2A3240'
        width: 118
        height: 22
        offset: {x: 96, y: 104, z: 3}
        tooltip: 点击按钮任意位置
        actions:
          all: 'sound: UI_BUTTON_CLICK-0.5-1'
          left: 'callback: ping'
      detail:
        type: button
        content: 查看详情
        color: '#3B6FE0'
        width: 118
        height: 22
        offset: {x: 226, y: 104, z: 3}
        actions: 'open: detail'
      coordinates:
        type: button
        content: 坐标校验
        color: '#2A3240'
        width: 118
        height: 22
        offset: {x: 356, y: 104, z: 3}
        actions: 'open: coordinates'
      calibrate:
        type: button
        content: 重新定位
        color: '#2A3240'
        width: 118
        height: 22
        offset: {x: 161, y: 136, z: 3}
        actions: calibrate
      close:
        type: button
        content: 关闭
        color: '#7A2E38'
        width: 118
        height: 22
        offset: {x: 291, y: 136, z: 3}
        actions: close
      hint: {type: text, content: LumaMenu · 实体渲染 · 透明 Dialog 点击, size: 6, color: '#5F6B7D', offset: {x: 226, y: 164, z: 1}}
  detail:
    title: 详情
    frontend:
      shell: *shell
      title: {type: text, content: 实体显示 · Dialog 交互, size: 10, color: '#E6EAF2', offset: {x: 226, y: 17, z: 1}}
      card: {type: rectangle, width: 380, height: 64, color: '#1C2330', offset: {x: 226, y: 80, z: 0.5}}
      mark: {type: rectangle, width: 3, height: 64, color: '#4F8CFF', offset: {x: 37.5, y: 80, z: 0.6}}
      body:
        type: text
        content: |-
          文字、按钮、物品与方块均为只发给你的展示实体
          点击由透明 Dialog 接收，换页保留会话、直接复用缓存
        color: '#C9D1DE'
        line-width: 340
        max-lines: 3
        alignment: left
        offset: {x: 226, y: 80, z: 1}
      back:
        type: button
        content: ← 返回
        color: '#2A3240'
        width: 118
        height: 22
        offset: {x: 161, y: 143, z: 2}
        actions: back
      close:
        type: button
        content: 关闭
        color: '#7A2E38'
        width: 118
        height: 22
        offset: {x: 291, y: 143, z: 2}
        actions: close
