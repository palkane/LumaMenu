schema-version: 3
id: demo
look-down: true
# Hit area 452x180. The panel and title reach into the free screen space above and below it.
canvas: {width: 452, height: 180}
pages:
  demo:
    title: 光幕菜单
    frontend:
      panel: &panel
        type: group
        offset: {x: 226, y: 70.5, z: -1}
        children:
          outline: {type: frame, width: 468, height: 237, color: '#000000'}
          fill: {type: rectangle, width: 466, height: 235, color: '#C6C6C6', offset: {z: 0.01}}
          light-top: {type: rectangle, width: 464, height: 2, color: '#FFFFFF', offset: {x: -1, y: -116.5, z: 0.02}}
          light-left: {type: rectangle, width: 2, height: 233, color: '#FFFFFF', offset: {x: -232, y: -1, z: 0.02}}
          shade-right: {type: rectangle, width: 2, height: 233, color: '#555555', offset: {x: 232, y: 1, z: 0.02}}
          shade-bottom: {type: rectangle, width: 464, height: 2, color: '#555555', offset: {x: 1, y: 116.5, z: 0.02}}
          rule-dark: {type: rectangle, width: 452, height: 1, color: '#8B8B8B', offset: {y: -88, z: 0.03}}
          rule-light: {type: rectangle, width: 452, height: 1, color: '#FFFFFF', offset: {y: -87, z: 0.03}}
      title: {type: text, content: 光幕菜单, size: 10, color: '#404040', offset: {x: 226, y: -31, z: 1}}
      card:
        type: group
        offset: {x: 162, y: 38, z: 0.5}
        children:
          dark: {type: rectangle, width: 312, height: 60, color: '#8B8B8B'}
          light: {type: rectangle, width: 311, height: 59, color: '#FFFFFF', offset: {x: 0.5, y: 0.5, z: 0.01}}
          fill: {type: rectangle, width: 310, height: 58, color: '#BDBDBD', offset: {z: 0.02}}
      status-label: {type: text, content: 状态, color: '#6B6B6B', line-width: 290, max-lines: 1, alignment: left, offset: {x: 161, y: 20, z: 1}}
      status:
        type: text
        content: '{status}'
        size: 10
        color: '#404040'
        line-width: 290
        max-lines: 1
        alignment: left
        offset: {x: 161, y: 44, z: 1}
      diamond-slot:
        type: group
        offset: {x: 352, y: 38, z: 0.5}
        children: &slot
          dark: {type: rectangle, width: 48, height: 48, color: '#373737'}
          light: {type: rectangle, width: 47, height: 47, color: '#FFFFFF', offset: {x: 0.5, y: 0.5, z: 0.01}}
          fill: {type: rectangle, width: 46, height: 46, color: '#8B8B8B', offset: {z: 0.02}}
      grass-slot:
        type: group
        offset: {x: 412, y: 38, z: 0.5}
        children: *slot
      diamond:
        type: item
        source: minecraft:diamond
        width: 32
        height: 32
        tooltip: 原版物品
        offset: {x: 352, y: 38, z: 2}
      grass:
        type: block
        source: minecraft:grass_block
        width: 26
        height: 26
        rotation: {x: 20, y: -30}
        tooltip: 立体方块
        offset: {x: 412, y: 38, z: 2}
      ping:
        type: button
        style: vanilla
        content: 测试回调
        width: 140
        height: 24
        offset: {x: 76, y: 94, z: 3}
        tooltip: 点击按钮任意位置
        actions:
          all: 'sound: UI_BUTTON_CLICK-0.5-1'
          left: 'callback: ping'
      detail:
        type: button
        style: vanilla
        content: 查看详情
        width: 140
        height: 24
        offset: {x: 226, y: 94, z: 3}
        actions: 'open: detail'
      coordinates:
        type: button
        style: vanilla
        content: 坐标校验
        width: 140
        height: 24
        offset: {x: 376, y: 94, z: 3}
        actions: 'open: coordinates'
      calibrate:
        type: button
        style: vanilla
        content: 重新定位
        width: 215
        height: 24
        offset: {x: 113.5, y: 126, z: 3}
        actions: calibrate
      close:
        type: button
        style: vanilla
        content: 关闭
        width: 215
        height: 24
        offset: {x: 338.5, y: 126, z: 3}
        actions: close
      hint: {type: text, content: 右上角 × 关闭 · 换 FOV、窗口或界面缩放后请重新定位, color: '#6B6B6B', offset: {x: 226, y: 162, z: 1}}
  detail:
    title: 详情
    frontend:
      panel: *panel
      title: {type: text, content: 详情, size: 10, color: '#404040', offset: {x: 226, y: -31, z: 1}}
      card:
        type: group
        offset: {x: 226, y: 60, z: 0.5}
        children:
          dark: {type: rectangle, width: 440, height: 100, color: '#8B8B8B'}
          light: {type: rectangle, width: 439, height: 99, color: '#FFFFFF', offset: {x: 0.5, y: 0.5, z: 0.01}}
          fill: {type: rectangle, width: 438, height: 98, color: '#BDBDBD', offset: {z: 0.02}}
      body:
        type: text
        content: 文字、按钮、物品与方块都是只发给你的展示实体，点击由透明 Dialog 接收。换页保留会话并复用缓存，不重新计算坐标。
        color: '#404040'
        line-width: 400
        max-lines: 4
        offset: {x: 226, y: 60, z: 1}
      back:
        type: button
        style: vanilla
        content: 返回
        width: 215
        height: 24
        offset: {x: 113.5, y: 150, z: 2}
        actions: back
      close:
        type: button
        style: vanilla
        content: 关闭
        width: 215
        height: 24
        offset: {x: 338.5, y: 150, z: 2}
        actions: close
