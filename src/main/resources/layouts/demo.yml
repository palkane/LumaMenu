schema-version: 3
id: demo
look-down: true
# Hit area only; the panel border and title row may reach outside it.
canvas: {width: 212, height: 126}
pages:
  demo:
    title: 光幕菜单
    frontend:
      panel: &panel
        type: group
        offset: {x: 106, y: 57}
        children:
          outline: {type: frame, width: 212, height: 122, color: '#000000'}
          fill: {type: rectangle, width: 210, height: 120, color: '#C6C6C6', offset: {z: 0.01}}
          light-top: {type: rectangle, width: 208, height: 2, color: '#FFFFFF', offset: {x: -1, y: -59, z: 0.02}}
          light-left: {type: rectangle, width: 2, height: 118, color: '#FFFFFF', offset: {x: -104, y: -1, z: 0.02}}
          shade-right: {type: rectangle, width: 2, height: 118, color: '#555555', offset: {x: 104, y: 1, z: 0.02}}
          shade-bottom: {type: rectangle, width: 208, height: 2, color: '#555555', offset: {x: 1, y: 59, z: 0.02}}
      title: {type: text, content: 光幕菜单, color: '#404040', offset: {x: 106, y: 6, z: 1}}
      status:
        type: text
        content: '{status}'
        color: '#404040'
        line-width: 150
        max-lines: 1
        alignment: left
        offset: {x: 83, y: 27, z: 1}
      diamond-slot:
        type: group
        offset: {x: 177, y: 27, z: 0.5}
        children: &slot
          dark: {type: rectangle, width: 18, height: 18, color: '#373737'}
          light: {type: rectangle, width: 17, height: 17, color: '#FFFFFF', offset: {x: 0.5, y: 0.5, z: 0.01}}
          fill: {type: rectangle, width: 16, height: 16, color: '#8B8B8B', offset: {z: 0.02}}
      grass-slot:
        type: group
        offset: {x: 197, y: 27, z: 0.5}
        children: *slot
      diamond:
        type: item
        source: minecraft:diamond
        width: 16
        height: 16
        tooltip: 原版物品
        offset: {x: 177, y: 27, z: 2}
      grass:
        type: block
        source: minecraft:grass_block
        width: 13
        height: 13
        rotation: {x: 20, y: -30}
        tooltip: 立体方块
        offset: {x: 197, y: 27, z: 2}
      ping:
        type: button
        style: vanilla
        content: 测试回调
        width: 98
        height: 20
        offset: {x: 55, y: 52, z: 3}
        tooltip: 点击按钮任意位置
        actions:
          all: 'sound: UI_BUTTON_CLICK-0.5-1'
          left: 'callback: ping'
      detail:
        type: button
        style: vanilla
        content: 查看详情
        width: 98
        height: 20
        offset: {x: 157, y: 52, z: 3}
        actions: 'open: detail'
      coordinates:
        type: button
        style: vanilla
        content: 坐标校验
        width: 98
        height: 20
        offset: {x: 55, y: 76, z: 3}
        actions: 'open: coordinates'
      calibrate:
        type: button
        style: vanilla
        content: 重新定位
        width: 98
        height: 20
        offset: {x: 157, y: 76, z: 3}
        actions: calibrate
      close:
        type: button
        style: vanilla
        content: 关闭
        width: 200
        height: 20
        offset: {x: 106, y: 100, z: 3}
        actions: close
  detail:
    title: 详情
    frontend:
      panel: *panel
      title: {type: text, content: 详情, color: '#404040', offset: {x: 106, y: 6, z: 1}}
      body:
        type: text
        content: 文字、按钮、物品与方块都是只发给你的展示实体，点击由透明 Dialog 接收；换页保留会话并复用缓存。
        color: '#404040'
        line-width: 196
        max-lines: 4
        offset: {x: 106, y: 46, z: 1}
      back:
        type: button
        style: vanilla
        content: 返回
        width: 98
        height: 20
        offset: {x: 55, y: 100, z: 2}
        actions: back
      close:
        type: button
        style: vanilla
        content: 关闭
        width: 98
        height: 20
        offset: {x: 157, y: 100, z: 2}
        actions: close
