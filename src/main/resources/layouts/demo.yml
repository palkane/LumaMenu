schema-version: 1
id: demo
look-down: true
canvas: {width: 452, height: 180}
pages:
  demo:
    title: 光幕菜单
    frontend:
      panel: &panel
        type: group
        children:
          fill: {type: rectangle, width: 420, height: 170, color: '#C6C6C6'}
          outline: {type: frame, width: 420, height: 170, color: '#000000', offset: {z: 0.01}}
          top: {type: line, width: 418, height: 2, color: '#FFFFFF', offset: {y: 83, z: 0.02}}
          left: {type: line, width: 2, height: 164, color: '#FFFFFF', offset: {x: -208, z: 0.02}}
          bottom: {type: line, width: 418, height: 2, color: '#555555', offset: {y: -83, z: 0.02}}
          right: {type: line, width: 2, height: 164, color: '#555555', offset: {x: 208, z: 0.02}}
      title:
        type: text
        content: 光幕菜单
        size: 10
        width: 150
        color: '#404040'
        offset: {y: 70.5, z: 1}
      status:
        type: text
        content: '{status}'
        width: 180
        color: '#404040'
        offset: {x: -86, y: 25.5, z: 2}
      diamond-slot:
        type: group
        offset: {x: 100, y: 25.5, z: 1}
        children: &slot
          light: {type: rectangle, width: 38, height: 38, color: '#FFFFFF'}
          dark: {type: rectangle, width: 37, height: 37, color: '#373737', offset: {x: -0.5, y: 0.5, z: 0.01}}
          fill: {type: rectangle, width: 36, height: 36, color: '#8B8B8B', offset: {z: 0.02}}
      grass-slot:
        type: group
        offset: {x: 150, y: 25.5, z: 1}
        children: *slot
      diamond:
        type: item
        source: minecraft:diamond
        width: 26
        height: 26
        tooltip: 原版物品
        offset: {x: 100, y: 25.5, z: 2}
      grass:
        type: block
        source: minecraft:grass_block
        width: 26
        height: 26
        rotation: {x: 20, y: -30}
        tooltip: 立体方块
        offset: {x: 150, y: 25.5, z: 2}
      ping:
        type: button
        style: vanilla
        content: 测试回调
        width: 118
        height: 20
        offset: {x: -130, y: -14.5, z: 3}
        tooltip: 点击按钮任意位置
        actions:
          all: 'sound: UI_BUTTON_CLICK-0.5-1'
          left: 'callback: ping'
      detail:
        type: button
        style: vanilla
        content: 查看详情
        width: 118
        height: 20
        offset: {y: -14.5, z: 3}
        actions: 'open: detail'
      coordinates:
        type: button
        style: vanilla
        content: 坐标校验
        width: 118
        height: 20
        offset: {x: 130, y: -14.5, z: 3}
        actions: 'open: coordinates'
      calibrate:
        type: button
        style: vanilla
        content: 重新定位
        width: 118
        height: 20
        offset: {x: -65, y: -43.5, z: 3}
        actions: calibrate
      close:
        type: button
        style: vanilla
        content: 关闭
        width: 118
        height: 20
        offset: {x: 65, y: -43.5, z: 3}
        actions: close
      hint:
        type: text
        content: Esc 关闭
        width: 90
        size: 7
        color: '#555555'
        offset: {y: -75.5, z: 1}
  detail:
    title: 详情
    frontend:
      panel: *panel
      title:
        type: text
        content: 实体显示，Dialog 交互
        size: 10
        width: 350
        color: '#404040'
        offset: {y: 58.5, z: 1}
      body:
        type: text
        content: |-
          文字、按钮、物品与方块均为实体
          换页保留会话，坐标直接复用缓存
        width: 350
        color: '#404040'
        offset: {y: 8.5, z: 1}
      back:
        type: button
        style: vanilla
        content: 返回
        width: 110
        height: 20
        offset: {x: -65, y: -53.5, z: 2}
        actions: back
      close:
        type: button
        style: vanilla
        content: 关闭
        width: 110
        height: 20
        offset: {x: 65, y: -53.5, z: 2}
        actions: close
