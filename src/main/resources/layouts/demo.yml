schema-version: 3
id: demo
look-down: true
# Hit area 344x126, centred in the Dialog body. The panel and title reach a little beyond it, but stay
# clear of the top HUD and of the experience bar (about 33 below this canvas on small GUI heights).
canvas: {width: 344, height: 126}
pages:
  demo:
    title: 光幕菜单
    frontend:
      panel: &panel
        type: group
        offset: {x: 172, y: 47, z: -1}
        children:
          outline: {type: frame, width: 360, height: 168, color: '#000000'}
          fill: {type: rectangle, width: 358, height: 166, color: '#C6C6C6', offset: {z: 0.01}}
          light-top: {type: rectangle, width: 356, height: 2, color: '#FFFFFF', offset: {x: -1, y: -82, z: 0.02}}
          light-left: {type: rectangle, width: 2, height: 164, color: '#FFFFFF', offset: {x: -178, y: -1, z: 0.02}}
          shade-right: {type: rectangle, width: 2, height: 164, color: '#555555', offset: {x: 178, y: 1, z: 0.02}}
          shade-bottom: {type: rectangle, width: 356, height: 2, color: '#555555', offset: {x: 1, y: 82, z: 0.02}}
          rule-dark: {type: rectangle, width: 344, height: 1, color: '#8B8B8B', offset: {y: -59.5, z: 0.03}}
          rule-light: {type: rectangle, width: 344, height: 1, color: '#FFFFFF', offset: {y: -58.5, z: 0.03}}
      title: {type: text, content: 光幕菜单, size: 10, color: '#404040', offset: {x: 172, y: -24, z: 1}}
      card:
        type: group
        offset: {x: 118, y: 32, z: 0.5}
        children:
          dark: {type: rectangle, width: 228, height: 40, color: '#8B8B8B'}
          light: {type: rectangle, width: 227, height: 39, color: '#FFFFFF', offset: {x: 0.5, y: 0.5, z: 0.01}}
          fill: {type: rectangle, width: 226, height: 38, color: '#BDBDBD', offset: {z: 0.02}}
      status-label: {type: text, content: 状态, color: '#6B6B6B', line-width: 210, max-lines: 1, alignment: left, offset: {x: 115, y: 20, z: 1}}
      status:
        type: text
        content: '{status}'
        color: '#404040'
        line-width: 210
        max-lines: 1
        alignment: left
        offset: {x: 115, y: 38, z: 1}
      diamond-slot:
        type: group
        offset: {x: 268, y: 32, z: 0.5}
        children: &slot
          dark: {type: rectangle, width: 44, height: 44, color: '#373737'}
          light: {type: rectangle, width: 43, height: 43, color: '#FFFFFF', offset: {x: 0.5, y: 0.5, z: 0.01}}
          fill: {type: rectangle, width: 42, height: 42, color: '#8B8B8B', offset: {z: 0.02}}
      grass-slot:
        type: group
        offset: {x: 318, y: 32, z: 0.5}
        children: *slot
      diamond:
        type: item
        source: minecraft:diamond
        width: 28
        height: 28
        tooltip: 原版物品
        offset: {x: 268, y: 32, z: 2}
      grass:
        type: block
        source: minecraft:grass_block
        width: 22
        height: 22
        rotation: {x: 20, y: -30}
        tooltip: 立体方块
        offset: {x: 318, y: 32, z: 2}
      ping:
        type: button
        style: vanilla
        content: 测试回调
        width: 108
        height: 22
        offset: {x: 58, y: 74, z: 3}
        tooltip: 点击按钮任意位置
        actions:
          all: 'sound: UI_BUTTON_CLICK-0.5-1'
          left: 'callback: ping'
      detail:
        type: button
        style: vanilla
        content: 查看详情
        width: 108
        height: 22
        offset: {x: 172, y: 74, z: 3}
        actions: 'open: detail'
      coordinates:
        type: button
        style: vanilla
        content: 坐标校验
        width: 108
        height: 22
        offset: {x: 286, y: 74, z: 3}
        actions: 'open: coordinates'
      calibrate:
        type: button
        style: vanilla
        content: 重新定位
        width: 165
        height: 22
        offset: {x: 86.5, y: 100, z: 3}
        actions: calibrate
      close:
        type: button
        style: vanilla
        content: 关闭
        width: 165
        height: 22
        offset: {x: 257.5, y: 100, z: 3}
        actions: close
      hint: {type: text, content: 右上角 × 关闭, color: '#6B6B6B', offset: {x: 172, y: 120, z: 1}}
  detail:
    title: 详情
    frontend:
      panel: *panel
      title: {type: text, content: 详情, size: 10, color: '#404040', offset: {x: 172, y: -24, z: 1}}
      card:
        type: group
        offset: {x: 172, y: 42, z: 0.5}
        children:
          dark: {type: rectangle, width: 336, height: 60, color: '#8B8B8B'}
          light: {type: rectangle, width: 335, height: 59, color: '#FFFFFF', offset: {x: 0.5, y: 0.5, z: 0.01}}
          fill: {type: rectangle, width: 334, height: 58, color: '#BDBDBD', offset: {z: 0.02}}
      body:
        type: text
        content: 文字、按钮、物品与方块都是只发给你的展示实体，点击由透明 Dialog 接收。换页保留会话并复用缓存，不重新计算坐标。
        color: '#404040'
        line-width: 310
        max-lines: 4
        offset: {x: 172, y: 42, z: 1}
      back:
        type: button
        style: vanilla
        content: 返回
        width: 165
        height: 22
        offset: {x: 86.5, y: 100, z: 2}
        actions: back
      close:
        type: button
        style: vanilla
        content: 关闭
        width: 165
        height: 22
        offset: {x: 257.5, y: 100, z: 2}
        actions: close
