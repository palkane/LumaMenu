schema-version: 3
id: transforms
canvas: {width: 452, height: 180}
frontend:
  panel:
    type: rectangle
    width: 440
    height: 176
    color: '#151A23'
    offset: {x: 226, y: 90}
  border:
    type: frame
    width: 440
    height: 176
    color: '#2C3442'
    offset: {x: 226, y: 90, z: 0.01}
  header:
    type: rectangle
    width: 438
    height: 28
    color: '#1C2330'
    offset: {x: 226, y: 15, z: 0.02}
  accent:
    type: line
    width: 438
    height: 1
    color: '#4F8CFF'
    offset: {x: 226, y: 29.5, z: 0.03}
  title:
    type: text
    content: XYZ 拉伸与旋转
    color: '#E6EAF2'
    width: 250
    offset: {x: 226, y: 15, z: 1}
  models:
    type: group
    offset: {x: 100, y: 65, z: 2}
    stretch: {x: 1.2, y: 0.9, z: 1.1}
    rotation: {z: 12}
    children:
      item:
        type: item
        source: minecraft:diamond
        width: 24
        height: 24
        stretch: {x: 1.5, y: 0.7, z: 0.5}
        rotation: {x: 15, y: -20, z: -10}
        offset: {x: -28}
        tooltip: 三轴拉伸物品
        actions: 'callback: item'
      block:
        type: block
        source: minecraft:stone
        width: 24
        height: 24
        stretch: {x: 1.4, y: 0.7, z: 0.5}
        rotation: {x: 20, y: -25, z: 8}
        offset: {x: 28}
        tooltip: 三轴拉伸方块
        actions: 'callback: block'
  shapes:
    type: group
    offset: {x: 250, y: 65, z: 3}
    stretch: {x: 1.3, y: 0.8, z: 1.1}
    rotation: {x: 10, y: 12, z: -12}
    children:
      frame:
        type: frame
        width: 75
        height: 35
        thickness: 2
        color: '#4F8CFF'
      line:
        type: line
        width: 70
        height: 2
        rotation: {z: 20}
        color: '#E6EAF2'
      text:
        type: text
        content: XYZ
        width: 30
        color: '#E6EAF2'
        stretch: {x: 1.2, y: 0.8}
        offset: {y: 28, z: 1}
  grid:
    type: grid
    width: 40
    height: 30
    step: 10
    color: '#8B95A7'
    stretch: {x: 1.2, y: 0.9, z: 1}
    rotation: {x: 10, y: -15, z: 20}
    offset: {x: 370, y: 65, z: 4}
    tooltip: 点击旋转十字
    actions: 'callback: grid'
  button:
    type: button
    content: 点击整个按钮
    color: '#3B6FE0'
    width: 130
    height: 24
    stretch: {x: 1.15, y: 0.85, z: 1}
    rotation: {x: 8, y: -10, z: -8}
    offset: {x: 226, y: 127, z: 5}
    actions: 'callback: button'
  status:
    type: text
    content: '{status}'
    width: 280
    color: '#8B95A7'
    offset: {x: 226, y: 164, z: 6}
