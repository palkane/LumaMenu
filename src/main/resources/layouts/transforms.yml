schema-version: 3
id: transforms
# Hit area only; the panel border and title row may reach outside it.
canvas: {width: 340, height: 144}
frontend:
  panel:
    type: group
    offset: {x: 170, y: 72}
    children:
      outline: {type: frame, width: 340, height: 152, color: '#000000'}
      fill: {type: rectangle, width: 338, height: 150, color: '#C6C6C6', offset: {z: 0.01}}
      light-top: {type: rectangle, width: 336, height: 2, color: '#FFFFFF', offset: {x: -1, y: -74, z: 0.02}}
      light-left: {type: rectangle, width: 2, height: 148, color: '#FFFFFF', offset: {x: -168, y: -1, z: 0.02}}
      shade-right: {type: rectangle, width: 2, height: 148, color: '#555555', offset: {x: 168, y: 1, z: 0.02}}
      shade-bottom: {type: rectangle, width: 336, height: 2, color: '#555555', offset: {x: 1, y: 74, z: 0.02}}
  title:
    type: text
    content: XYZ 拉伸与旋转
    color: '#404040'
    width: 250
    offset: {x: 170, y: 6, z: 1}
  models:
    type: group
    offset: {x: 70, y: 50, z: 2}
    stretch: {x: 1.2, y: 0.9, z: 1.1}
    rotation: {z: 12}
    children:
      item:
        type: item
        source: minecraft:diamond
        width: 24
        height: 24
        stretch: {x: 1.5, y: 0.7, z: 0.5}
        rotation: {x: 15, y: -20, z: -10}
        offset: {x: -28}
        tooltip: 三轴拉伸物品
        actions: 'callback: item'
      block:
        type: block
        source: minecraft:stone
        width: 24
        height: 24
        stretch: {x: 1.4, y: 0.7, z: 0.5}
        rotation: {x: 20, y: -25, z: 8}
        offset: {x: 28}
        tooltip: 三轴拉伸方块
        actions: 'callback: block'
  shapes:
    type: group
    offset: {x: 185, y: 50, z: 3}
    stretch: {x: 1.3, y: 0.8, z: 1.1}
    rotation: {x: 10, y: 12, z: -12}
    children:
      frame:
        type: frame
        width: 75
        height: 35
        thickness: 2
        color: '#373737'
      line:
        type: line
        width: 70
        height: 2
        rotation: {z: 20}
        color: '#FFFFFF'
      text:
        type: text
        content: XYZ
        width: 30
        color: '#404040'
        stretch: {x: 1.2, y: 0.8}
        offset: {y: 28, z: 1}
  grid:
    type: grid
    width: 40
    height: 30
    step: 10
    color: '#555555'
    stretch: {x: 1.2, y: 0.9, z: 1}
    rotation: {x: 10, y: -15, z: 20}
    offset: {x: 285, y: 50, z: 4}
    tooltip: 点击旋转十字
    actions: 'callback: grid'
  button:
    type: button
    style: vanilla
    content: 点击整个按钮
    width: 130
    height: 24
    stretch: {x: 1.15, y: 0.85, z: 1}
    rotation: {x: 8, y: -10, z: -8}
    offset: {x: 170, y: 102, z: 5}
    actions: 'callback: button'
  status:
    type: text
    content: '{status}'
    width: 280
    color: '#404040'
    offset: {x: 170, y: 134, z: 6}
