schema-version: 3
id: transforms
# Hit area 452x180. The panel and title reach into the free screen space above and below it.
canvas: {width: 452, height: 180}
frontend:
  panel:
    type: group
    offset: {x: 226, y: 70.5, z: -1}
    children:
      outline: {type: frame, width: 468, height: 237, color: '#000000'}
      fill: {type: rectangle, width: 466, height: 235, color: '#C6C6C6', offset: {z: 0.01}}
      light-top: {type: rectangle, width: 464, height: 2, color: '#FFFFFF', offset: {x: -1, y: -116.5, z: 0.02}}
      light-left: {type: rectangle, width: 2, height: 233, color: '#FFFFFF', offset: {x: -232, y: -1, z: 0.02}}
      shade-right: {type: rectangle, width: 2, height: 233, color: '#555555', offset: {x: 232, y: 1, z: 0.02}}
      shade-bottom: {type: rectangle, width: 464, height: 2, color: '#555555', offset: {x: 1, y: 116.5, z: 0.02}}
  title:
    type: text
    content: XYZ 拉伸与旋转
    color: '#404040'
    size: 10
    offset: {x: 226, y: -31, z: 1}
  models:
    type: group
    offset: {x: 100, y: 65, z: 2}
    stretch: {x: 1.2, y: 0.9, z: 1.1}
    rotation: {z: 12}
    children:
      item:
        type: item
        source: minecraft:diamond
        width: 24
        height: 24
        stretch: {x: 1.5, y: 0.7, z: 0.5}
        rotation: {x: 15, y: -20, z: -10}
        offset: {x: -28}
        tooltip: 三轴拉伸物品
        actions: 'callback: item'
      block:
        type: block
        source: minecraft:stone
        width: 24
        height: 24
        stretch: {x: 1.4, y: 0.7, z: 0.5}
        rotation: {x: 20, y: -25, z: 8}
        offset: {x: 28}
        tooltip: 三轴拉伸方块
        actions: 'callback: block'
  shapes:
    type: group
    offset: {x: 250, y: 65, z: 3}
    stretch: {x: 1.3, y: 0.8, z: 1.1}
    rotation: {x: 10, y: 12, z: -12}
    children:
      frame:
        type: frame
        width: 75
        height: 35
        thickness: 2
        color: '#373737'
      line:
        type: line
        width: 70
        height: 2
        rotation: {z: 20}
        color: '#FFFFFF'
      text:
        type: text
        content: XYZ
        width: 30
        color: '#404040'
        stretch: {x: 1.2, y: 0.8}
        offset: {y: 28, z: 1}
  grid:
    type: grid
    width: 40
    height: 30
    step: 10
    color: '#555555'
    stretch: {x: 1.2, y: 0.9, z: 1}
    rotation: {x: 10, y: -15, z: 20}
    offset: {x: 370, y: 65, z: 4}
    tooltip: 点击旋转十字
    actions: 'callback: grid'
  button:
    type: button
    style: vanilla
    content: 点击整个按钮
    width: 130
    height: 24
    stretch: {x: 1.15, y: 0.85, z: 1}
    rotation: {x: 8, y: -10, z: -8}
    offset: {x: 226, y: 127, z: 5}
    actions: 'callback: button'
  status:
    type: text
    content: '{status}'
    width: 280
    color: '#404040'
    offset: {x: 226, y: 164, z: 6}
