schema-version: 3
id: features
events:
  open: 'sound: UI_BUTTON_CLICK-0.5-1'
  close: 'tell: 已关闭功能演示'
# Hit area only; the panel border and title row may reach outside it.
canvas: {width: 260, height: 126}
pages:
  features:
    title: 功能演示
    frontend:
      panel:
        type: group
        offset: {x: 130, y: 64}
        children:
          outline: {type: frame, width: 260, height: 136, color: '#000000'}
          fill: {type: rectangle, width: 258, height: 134, color: '#C6C6C6', offset: {z: 0.01}}
          light-top: {type: rectangle, width: 256, height: 2, color: '#FFFFFF', offset: {x: -1, y: -66, z: 0.02}}
          light-left: {type: rectangle, width: 2, height: 132, color: '#FFFFFF', offset: {x: -128, y: -1, z: 0.02}}
          shade-right: {type: rectangle, width: 2, height: 132, color: '#555555', offset: {x: 128, y: 1, z: 0.02}}
          shade-bottom: {type: rectangle, width: 256, height: 2, color: '#555555', offset: {x: 1, y: 66, z: 0.02}}
      title: {type: text, content: 功能演示, color: '#404040', offset: {x: 130, y: 6, z: 1}}
      legacy:
        type: text
        content: '&c红色 &2绿色 &9&n下划线&r &m删除线&r &o斜体&r &#FF8800十六进制'
        color: '#404040'
        offset: {x: 130, y: 22, z: 1}
      left:
        type: text
        content: 左对齐：中文与 English 混排，按真实字宽换行。
        color: '#404040'
        line-width: 76
        max-lines: 4
        alignment: left
        offset: {x: 46, y: 50, z: 1}
      center:
        type: text
        content: 居中：固定宽度内换行，动态超行用省略号截断。
        color: '#404040'
        line-width: 76
        max-lines: 4
        alignment: center
        offset: {x: 130, y: 50, z: 1}
      right:
        type: text
        content: '&l右对齐&r：每行补齐同宽，点击范围不变。'
        color: '#404040'
        line-width: 76
        max-lines: 4
        alignment: right
        offset: {x: 214, y: 50, z: 1}
      faint: {type: text, content: 半透明文字 opacity 128, color: '#404040', opacity: 128, offset: {x: 130, y: 80, z: 1}}
      gesture:
        type: button
        style: vanilla
        content: 单击/双击
        width: 80
        height: 20
        offset: {x: 46, y: 100, z: 2}
        tooltip: 300毫秒内再次点击为双击
        actions:
          single: ['tell: 单击', 'sound: UI_BUTTON_CLICK-0.5-1']
          double: ['tell: 双击', 'sound: ENTITY_EXPERIENCE_ORB_PICKUP-0.5-1']
      inplace:
        type: button
        style: vanilla
        content: 原位执行命令
        width: 80
        height: 20
        offset: {x: 130, y: 100, z: 2}
        tooltip: command-in-place：菜单保持打开
        actions: 'command-in-place: lumamenu mode'
      next:
        type: button
        style: vanilla
        content: 原生关闭页
        width: 80
        height: 20
        offset: {x: 214, y: 100, z: 2}
        actions: 'open: features-native'
      status: {type: text, content: '{status}', color: '#404040', offset: {x: 130, y: 121, z: 1}}
  features-native:
    title: 原生关闭
    corner-close: false
    frontend:
      panel:
        type: group
        offset: {x: 130, y: 63}
        children:
          outline: {type: frame, width: 260, height: 80, color: '#000000'}
          fill: {type: rectangle, width: 258, height: 78, color: '#C6C6C6', offset: {z: 0.01}}
          light-top: {type: rectangle, width: 256, height: 2, color: '#FFFFFF', offset: {x: -1, y: -38, z: 0.02}}
          light-left: {type: rectangle, width: 2, height: 76, color: '#FFFFFF', offset: {x: -128, y: -1, z: 0.02}}
          shade-right: {type: rectangle, width: 2, height: 76, color: '#555555', offset: {x: 128, y: 1, z: 0.02}}
          shade-bottom: {type: rectangle, width: 256, height: 2, color: '#555555', offset: {x: 1, y: 38, z: 0.02}}
      title: {type: text, content: 原生关闭, color: '#404040', offset: {x: 130, y: 33, z: 1}}
      note:
        type: text
        content: '本页 corner-close: false，用屏幕底部原生“关闭”按钮或 Esc 关闭。'
        color: '#404040'
        line-width: 240
        max-lines: 2
        offset: {x: 130, y: 55, z: 1}
      back:
        type: button
        style: vanilla
        content: 返回
        width: 98
        height: 20
        offset: {x: 130, y: 85, z: 2}
        actions: back
