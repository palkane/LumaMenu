schema-version: 3
id: features
events:
  open: 'sound: UI_BUTTON_CLICK-0.5-1'
  close: 'tell: 已关闭功能演示'
canvas: {width: 452, height: 180}
pages:
  features:
    title: 功能演示
    frontend:
      shell: &shell
        type: group
        children:
          panel: {type: rectangle, width: 444, height: 176, color: '#151A23', offset: {x: 226, y: 90}}
          border: {type: frame, width: 444, height: 176, color: '#2C3442', offset: {x: 226, y: 90, z: 0.01}}
          header: {type: rectangle, width: 442, height: 30, color: '#1C2330', offset: {x: 226, y: 17, z: 0.02}}
          accent: {type: line, width: 442, height: 1, color: '#4F8CFF', offset: {x: 226, y: 32.5, z: 0.03}}
      title: {type: text, content: 功能演示, size: 10, color: '#E6EAF2', offset: {x: 226, y: 17, z: 1}}
      legacy:
        type: text
        content: '&c红色 &a绿色 &9&n下划线&r &m删除线&r &o斜体&r &#FF8800十六进制色'
        color: '#C9D1DE'
        offset: {x: 226, y: 45, z: 1}
      left-card: {type: rectangle, width: 136, height: 50, color: '#1C2330', offset: {x: 79, y: 82, z: 0.5}}
      left-mark: {type: rectangle, width: 2, height: 50, color: '#4F8CFF', offset: {x: 12, y: 82, z: 0.6}}
      left:
        type: text
        content: '左对齐：The quick brown fox jumps over the lazy dog，中文与 English 混排自动换行。'
        color: '#C9D1DE'
        line-width: 124
        max-lines: 4
        alignment: left
        offset: {x: 80, y: 82, z: 1}
      center-card: {type: rectangle, width: 136, height: 50, color: '#1C2330', offset: {x: 226, y: 82, z: 0.5}}
      center:
        type: text
        content: '居中：同一段文字在固定宽度的框里换行，超过 max-lines 的动态内容会以省略号截断。'
        color: '#C9D1DE'
        line-width: 124
        max-lines: 4
        alignment: center
        offset: {x: 226, y: 82, z: 1}
      right-card: {type: rectangle, width: 136, height: 50, color: '#1C2330', offset: {x: 373, y: 82, z: 0.5}}
      right-mark: {type: rectangle, width: 2, height: 50, color: '#4F8CFF', offset: {x: 440, y: 82, z: 0.6}}
      right:
        type: text
        content: '&l右对齐粗体&r：每一行都被填充到同样宽度，所以位置和点击范围固定不变。'
        color: '#C9D1DE'
        line-width: 124
        max-lines: 4
        alignment: right
        offset: {x: 372, y: 82, z: 1}
      faint: {type: text, content: '半透明文字 opacity 128', color: '#E6EAF2', opacity: 128, offset: {x: 226, y: 117, z: 1}}
      gesture:
        type: button
        content: 单击 / 双击
        color: '#2A3240'
        width: 120
        height: 22
        offset: {x: 86, y: 140, z: 2}
        tooltip: 300毫秒内再次点击为双击
        actions:
          single: ['tell: 单击', 'sound: UI_BUTTON_CLICK-0.5-1']
          double: ['tell: 双击', 'sound: ENTITY_EXPERIENCE_ORB_PICKUP-0.5-1']
      inplace:
        type: button
        content: 原位执行命令
        color: '#2A3240'
        width: 120
        height: 22
        offset: {x: 226, y: 140, z: 2}
        tooltip: command-in-place：菜单保持打开
        actions: 'command-in-place: lumamenu mode'
      next:
        type: button
        content: 原生关闭页 →
        color: '#3B6FE0'
        width: 120
        height: 22
        offset: {x: 366, y: 140, z: 2}
        actions: 'open: features-native'
      status: {type: text, content: '{status}', size: 6, color: '#8B95A7', offset: {x: 226, y: 164, z: 1}}
  features-native:
    title: 原生关闭
    corner-close: false
    frontend:
      shell:
        type: group
        children:
          panel: {type: rectangle, width: 444, height: 150, color: '#151A23', offset: {x: 226, y: 77}}
          border: {type: frame, width: 444, height: 150, color: '#2C3442', offset: {x: 226, y: 77, z: 0.01}}
          header: {type: rectangle, width: 442, height: 30, color: '#1C2330', offset: {x: 226, y: 17, z: 0.02}}
          accent: {type: line, width: 442, height: 1, color: '#4F8CFF', offset: {x: 226, y: 32.5, z: 0.03}}
      title: {type: text, content: 原生关闭按钮, size: 10, color: '#E6EAF2', offset: {x: 226, y: 17, z: 1}}
      card: {type: rectangle, width: 300, height: 40, color: '#1C2330', offset: {x: 226, y: 66, z: 0.5}}
      mark: {type: rectangle, width: 2, height: 40, color: '#4F8CFF', offset: {x: 77, y: 66, z: 0.6}}
      note:
        type: text
        content: |-
          本页 corner-close: false
          用下方原生“关闭”按钮或 Esc 关闭
        color: '#C9D1DE'
        line-width: 270
        max-lines: 2
        offset: {x: 226, y: 66, z: 1}
      back:
        type: button
        content: ← 返回
        color: '#2A3240'
        width: 120
        height: 22
        offset: {x: 226, y: 112, z: 2}
        actions: back
      hint: {type: text, content: ↓, size: 6, color: '#5F6B7D', offset: {x: 226, y: 143, z: 1}}
