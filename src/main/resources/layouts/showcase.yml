schema-version: 3
id: showcase
# LumaMenu 功能一览：/lumamenu open 默认打开这一页。不写 theme:，跟随玩家选择的主题（内置为原版风 vanilla）；右上角两个标签切换随包附带的原版/末地主题。
# 坐标为左上角原点、Y 向下的画布坐标（452x180），offset 是节点中心；画面可超出画布，点击区不会。
# 网格与集合需要 Skript 或插件 API 提供数据，不在本页演示。
state:
  'on': 'false'
  name: （尚未输入）
  notice: ''
variables:
  is-vanilla: {type: literal, source: '{theme}', values: {vanilla: 'true'}, fallback: 'false'}
  not-vanilla: {type: literal, source: '{theme}', values: {vanilla: 'false'}, fallback: 'true'}
  is-end: {type: literal, source: '{theme}', values: {end: 'true'}, fallback: 'false'}
  not-end: {type: literal, source: '{theme}', values: {end: 'false'}, fallback: 'true'}
  on-label: {type: state, source: 'on', values: {'true': 开启, 'false': 关闭}, fallback: 关闭}
  on-color: {type: state, source: 'on', values: {'true': '#3FA34D', 'false': '#B03A2E'}, fallback: '#B03A2E'}
  bar-value: {type: state, source: 'on', values: {'true': '0.85', 'false': '0.3'}, fallback: '0.3'}
  on-show: {type: state, source: 'on', values: {'true': 'true', 'false': 'false'}, fallback: 'false'}
  off-show: {type: state, source: 'on', values: {'true': 'false', 'false': 'true'}, fallback: 'true'}
forms:
  name:
    title: 输入框演示
    submit: 确定
    cancel: 取消
    fields:
      name: {label: 随便写点什么, initial: '', max-length: 32}
pages:
  showcase:
    title: 功能一览
    frontend:
      panel: {type: panel, width: 436, height: 166, header: 24, offset: {x: 226, y: 79, z: -1}}
      title: {type: text, content: '&lLumaMenu', color: '@title', alignment: left, line-width: 66, max-lines: 1, offset: {x: 51, y: 8}}
      subtitle: {type: text, content: '功能一览 · 你好，{player}', color: '@muted', alignment: left, line-width: 150, max-lines: 1, offset: {x: 163, y: 8}}
      notice: {type: text, content: '{notice}', color: '@accent-text', line-width: 80, max-lines: 1, offset: {x: 284, y: 8}}
      vanilla-on: {type: tab, content: 原版, selected: true, width: 44, height: 16, visible-if: '{is-vanilla}', offset: {x: 350, y: 8}, tooltip: 当前主题}
      vanilla-off: {type: tab, content: 原版, width: 44, height: 16, visible-if: '{not-vanilla}', actions: 'theme: vanilla', offset: {x: 350, y: 8}, tooltip: 切换主题（整页重画）}
      end-on: {type: tab, content: 末地, selected: true, width: 44, height: 16, visible-if: '{is-end}', offset: {x: 396, y: 8}, tooltip: 当前主题}
      end-off: {type: tab, content: 末地, width: 44, height: 16, visible-if: '{not-end}', actions: 'theme: end', offset: {x: 396, y: 8}, tooltip: 切换主题（整页重画）}
      close: {type: button, style: theme, content: ×, width: 16, height: 16, actions: close, offset: {x: 428, y: 8}, tooltip: 关闭（也可按 Esc）}

      # 第一行：模型与图片 / 文字排版 / 状态与变量
      models-card: {type: card, width: 136, height: 52, offset: {x: 82, y: 52, z: -0.5}}
      models-title: {type: text, content: '&l模型与图片', color: '@title', alignment: left, line-width: 120, max-lines: 1, offset: {x: 80, y: 33}}
      diamond: {type: item, source: 'minecraft:diamond', width: 22, height: 22, offset: {x: 34, y: 58}, tooltip: 原版物品，物品栏姿态}
      grass: {type: item, source: 'minecraft:grass_block', width: 22, height: 22, offset: {x: 66, y: 58}, tooltip: 方块，物品栏姿态（30°斜视）}
      apple: {type: image, source: 'minecraft:item/apple', width: 20, height: 20, offset: {x: 98, y: 58}, tooltip: 'type: image，引用原版贴图'}
      sword: {type: item, source: 'minecraft:netherite_sword', width: 20, height: 20, rotation: {z: 45}, stretch: {x: 1.4}, offset: {x: 130, y: 58}, tooltip: 'XYZ 旋转与拉伸（rotation / stretch）'}

      text-card: {type: card, width: 136, height: 52, offset: {x: 226, y: 52, z: -0.5}}
      text-title: {type: text, content: '&l文字排版', color: '@title', alignment: left, line-width: 120, max-lines: 1, offset: {x: 224, y: 33}}
      colors: {type: text, content: '&c红 &a绿 &#3F76E4自定义 &l粗体&r &o斜体', color: '@text', alignment: left, line-width: 124, max-lines: 1, offset: {x: 226, y: 45}}
      wrap: {type: text, content: 服务端按真实字宽换行，位置与点击区恒定, color: '@text', line-width: 124, max-lines: 2, offset: {x: 226, y: 59}, tooltip: 'line-width + max-lines'}
      faint: {type: text, content: 半透明, color: '@text', opacity: 110, alignment: left, line-width: 60, max-lines: 1, offset: {x: 194, y: 72}}
      right: {type: text, content: 右对齐, color: '@muted', alignment: right, line-width: 60, max-lines: 1, offset: {x: 258, y: 72}}

      state-card: {type: card, width: 136, height: 52, offset: {x: 370, y: 52, z: -0.5}}
      state-title: {type: text, content: '&l状态与变量', color: '@title', alignment: left, line-width: 80, max-lines: 1, offset: {x: 348, y: 33}}
      toggle: {type: button, style: theme, content: 切换, width: 36, height: 14, actions: 'toggle: on', offset: {x: 416, y: 33}, tooltip: 'toggle 改变会话状态，只刷新变化处'}
      on-text: {type: text, content: '开关：{on-label}', color: '{on-color}', alignment: left, line-width: 120, max-lines: 1, offset: {x: 370, y: 46}, tooltip: 颜色也来自变量}
      dot: {type: badge, offset: {x: 312, y: 58}}
      bar: {type: bar, value: '{bar-value}', width: 108, height: 6, offset: {x: 372, y: 58}}
      shown: {type: text, content: '&a开关打开后才出现', alignment: left, line-width: 120, max-lines: 1, visible-if: '{on-show}', offset: {x: 370, y: 70}}
      hidden: {type: text, content: 'visible-if 控制显示', color: '@muted', alignment: left, line-width: 120, max-lines: 1, visible-if: '{off-show}', offset: {x: 370, y: 70}}

      # 第二行：动作 / 按钮与输入
      actions-card: {type: card, width: 208, height: 56, offset: {x: 118, y: 112, z: -0.5}}
      actions-title: {type: text, content: '&l动作', color: '@title', alignment: left, line-width: 120, max-lines: 1, offset: {x: 80, y: 91}}
      do-notice: {type: button, style: theme, content: 提示, icon: 'minecraft:oak_sign', icon-size: 12, width: 96, height: 18, actions: 'notice: 你点了提示', offset: {x: 68, y: 105}, tooltip: 'notice：写到标题栏'}
      do-sound: {type: button, style: theme, content: 音效, icon: 'minecraft:note_block', icon-size: 12, width: 96, height: 18, actions: 'sound: block.note_block.bell-0.8-1.2', offset: {x: 168, y: 105}, tooltip: 'sound：自带音效时不再播放主题点击声'}
      do-tell: {type: button, style: theme, content: 聊天消息, icon: 'minecraft:paper', icon-size: 12, width: 96, height: 18, actions: 'tell: &d这条消息只发给你', offset: {x: 68, y: 127}, tooltip: 'tell：发送聊天消息'}
      do-open: {type: button, style: theme, content: 打开页面, icon: 'minecraft:compass', icon-size: 12, width: 96, height: 18, actions: 'open: coordinates', offset: {x: 168, y: 127}, tooltip: 'open：换页，会话与状态保留'}

      input-card: {type: card, width: 208, height: 56, offset: {x: 334, y: 112, z: -0.5}}
      input-title: {type: text, content: '&l按钮与输入', color: '@title', alignment: left, line-width: 120, max-lines: 1, offset: {x: 296, y: 91}}
      gesture: {type: button, style: theme, variant: primary, content: 单击/双击, width: 70, height: 18, offset: {x: 272, y: 108}, tooltip: 单击与双击执行不同动作, actions: {single: 'notice: 单击', double: 'notice: 双击'}}
      ask: {type: button, style: theme, content: 输入框, width: 56, height: 18, actions: 'form: name', offset: {x: 343, y: 108}, tooltip: 打开原生输入框，结果写回状态}
      off: {type: button, style: theme, variant: disabled, content: 不可用, width: 56, height: 18, offset: {x: 407, y: 108}, tooltip: 禁用样式}
      answer: {type: text, content: '输入内容：{name}', color: '@text', alignment: left, line-width: 196, max-lines: 1, offset: {x: 334, y: 128}}

      # 底部
      hint: {type: text, content: 悬停查看说明 · Esc 关闭 · /lumamenu theme 切换主题, color: '@muted', alignment: left, line-width: 260, max-lines: 1, offset: {x: 144, y: 149}}
      calibrate: {type: button, style: theme, content: 重新定位, width: 64, height: 16, actions: calibrate, offset: {x: 334, y: 149}, tooltip: 更换窗口、FOV 或 GUI 缩放后重新定位}
      coordinates: {type: button, style: theme, content: 坐标校验, width: 64, height: 16, actions: 'open: coordinates', offset: {x: 404, y: 149}, tooltip: 整片点击网格}
