# LumaMenu 主题。布局文件顶层写 theme: <名字> 就固定用它；不写则跟随玩家选择（/lumamenu theme 或布局动作 theme: <名字>），未选时用 default。
# 跟随玩家的布局会为每个非默认主题各编译一份页面（ID 记为 页面~主题）。label 为玩家看到的名字。
# 这里列出主题后只有列出的主题可用；删掉本文件则只有内置的 vanilla。
# 颜色在任何 color 字段里写 '@名字'（需加引号）。每个主题都从内置 vanilla 的颜色开始，新主题只写要改的。
# 可选颜色（只在写了的主题里画）：panel-shade 面板 2 单位立体边（上、左用 panel-highlight，下、右用此色），button-light 普通按钮上、左 1 单位高光，
#   card-light 信息卡下、右边线（凹陷感），panel-inset 面板内 3 单位处的内框线，header-gem 标题栏线中央的小方块，card-stripe 信息卡左侧 2 单位竖条。
# button-text：普通按钮与未选中标签的文字色，不写则同 text。
# click-sound：点击菜单按钮时播放的声音，格式同布局动作 sound:（声音ID[-音量[-音调]]）；按钮自己带 sound: 动作时不重复播放；留空为无声。
# corner：images/ 下的路径前缀，面板四角依次用 <前缀>-tl/-tr/-bl/-br.png，空则不画角饰；corner-size 为显示边长（单位）。
default: vanilla
themes:
  # 原版容器风：#C6C6C6 面板、黑色外框、白色高光与 #555555 阴影，灰色原版按钮配白字；强调色取经验条的绿。
  vanilla:
    label: 原版
    click-sound: ui.button.click-0.25-1
    corner: ''
    colors:
      panel: '#C6C6C6'
      panel-border: '#C6C6C6'
      panel-glow: '#000000'
      panel-highlight: '#FFFFFF'
      panel-shade: '#555555'
      header: '#C6C6C6'
      header-line: '#8B8B8B'
      title: '#404040'
      text: '#404040'
      muted: '#6B6B6B'
      accent: '#4F8A2B'
      accent-dark: '#2E5A17'
      accent-light: '#7DBE4E'
      accent-text: '#2E6B12'
      on-accent: '#FFFFFF'
      button: '#6F6F6F'
      button-border: '#000000'
      button-shade: '#555555'
      button-light: '#AAAAAA'
      button-text: '#FFFFFF'
      disabled: '#8B8B8B'
      disabled-border: '#555555'
      card: '#BDBDBD'
      card-border: '#8B8B8B'
      card-light: '#FFFFFF'
      track: '#373737'
      slot-empty: '#8B8B8B'
  # 末地风：虚空深紫面板、紫珀块边框、末地石淡黄文字，标题栏中央一颗末影之眼青色宝石。
  end:
    label: 末地
    click-sound: item.chorus_fruit.teleport-0.25-1.6
    corner: ''
    colors:
      panel: '#1B1526'
      panel-border: '#A97FA9'
      panel-glow: '#0A0710'
      panel-highlight: '#3A2C4A'
      panel-inset: '#2E2340'
      header: '#231B31'
      header-line: '#7D5A86'
      header-gem: '#3FBFA0'
      title: '#EDE9AE'
      text: '#DCD8BC'
      muted: '#9A8FA8'
      accent: '#A06BAF'
      accent-dark: '#6E4778'
      accent-light: '#C99BD4'
      accent-text: '#D3A6DE'
      on-accent: '#FFFFFF'
      button: '#2C2239'
      button-border: '#7D5A86'
      button-shade: '#1E1729'
      button-light: '#4A3A5E'
      button-text: '#EDE9AE'
      disabled: '#221B2B'
      disabled-border: '#3A2F46'
      card: '#211A2D'
      card-border: '#4A3A5E'
      track: '#120E19'
      slot-empty: '#4A3A5E'
