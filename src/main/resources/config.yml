# true: Dialog 正文右上角绘制可点击的 ×，禁用 Esc，移除底部退出按钮。
# × 独占正文右上角 10x9 点击单位，会占位，该区域不再响应布局控件。
# false: 恢复原生底部“关闭”按钮和 Esc；底部栏约占 33 高，小窗口可能滚动。
corner-close: true

# 右上角 × 页面是否也允许 Esc 关闭（默认开启）；不占任何点击格子。页面或布局文件写 close-with-escape: false 可单独关闭。
# Esc 关闭 Dialog 不会通知服务器，插件在显示后 5 tick 起按玩家转动视角超过 1° 判定已关闭；关闭后到转动视角前菜单画面会残留。
# corner-close: false 的原生关闭页本身就支持 Esc，不受此项影响。修改后执行 /lumamenu reload。
close-with-escape: true

# 导出资源包时隐藏顶部警告图标，默认开启；修改后 reload/export 并按 CE 流程重新合包。
# 覆盖同资源包内所有 Dialog 的三个警告图标，原生点击、悬停提示和顶部占位仍存在。
# 不修改共用 GUI shader，避免隐藏白框时影响其他界面。
hide-warning: true

# 旋转节点（含父组旋转）的点击轮廓精度，支持 1、2、4、8、16，默认 2 个最小点击单位。
# 越大阶梯越粗、通常字形/发包越少；轮廓相交的整格可点击，边缘可能向外多出不足一格。
# 模型按 bounds、其他控件按矩形投影；不改实体画面，不检测纹理透明像素。
# 只有拉伸而无旋转时保持 1 单位命中精度；未变换的普通控件和定位网格不变。
# reload 时按个人校准编译并保存，打开复用缓存；修改后执行 /lumamenu reload。
rotation-hit-step: 2

# 尚未定位的玩家每次登录、资源包加载完成约 1 秒后自动打开一次定位界面（本次登录只提示一次）。
# 取消或失败保留旧状态，之后仍可 /lumamenu calibrate 或在打开菜单时定位；修改后执行 /lumamenu reload。
calibrate-on-join: true
