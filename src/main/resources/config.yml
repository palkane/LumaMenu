# true: Dialog 正文右上角绘制可点击的 ×，禁用 Esc，移除底部退出按钮。
# × 独占正文右上角 10x9 点击单位，会占位，该区域不再响应布局控件。
# false: 恢复原生底部“关闭”按钮和 Esc；底部栏约占 33 高，小窗口可能滚动。
corner-close: true

# 右上角 × 页面是否也允许 Esc 关闭（默认开启）；不占任何点击格子。页面或布局文件写 close-with-escape: false 可单独关闭。
# Esc 关闭 Dialog 不会通知服务器，插件在显示后 5 tick 起按玩家新按下移动/跳跃/潜行键判定已关闭（客户端被告知创造模式时，
# 挖掘、挥手、使用、拾取等操作也算）；关闭后到按键前菜单画面会残留。
# corner-close: false 的原生关闭页本身就支持 Esc，不受此项影响。修改后执行 /lumamenu reload。
close-with-escape: true

# 导出资源包时隐藏顶部警告图标，默认开启；修改后 reload/export 并按 CE 流程重新合包。
# 覆盖同资源包内所有 Dialog 的三个警告图标，原生点击、悬停提示和顶部占位仍存在。
# 不修改共用 GUI shader，避免隐藏白框时影响其他界面。
hide-warning: true

# 旋转节点（含父组旋转）的点击轮廓精度，支持 1、2、4、8、16，默认 2 个最小点击单位。
# 越大阶梯越粗、通常字形/发包越少；轮廓相交的整格可点击，边缘可能向外多出不足一格。
# 模型按 bounds、其他控件按矩形投影；不改实体画面，不检测纹理透明像素。
# 只有拉伸而无旋转时保持 1 单位命中精度；未变换的普通控件和定位网格不变。
# reload 时按个人校准编译并保存，打开复用缓存；修改后执行 /lumamenu reload。
rotation-hit-step: 2

# 尚未定位的玩家每次登录、资源包加载完成约 1 秒后自动打开一次定位界面（本次登录只提示一次）。
# 取消或失败保留旧状态，之后仍可 /lumamenu calibrate 或在打开菜单时定位；修改后执行 /lumamenu reload。
calibrate-on-join: true

# 定位时每个角点几次（2、3 或 4）。格子逐次缩小，最后一次的格子大小决定精度：
# 3 次（32→8→1 单位，默认）与 4 次（32→8→2→1）精度相同，因为点击最小就是 1 单位；
# 2 次（27→3）少点 4 下，但平均偏差约是 3 次的 2.7 倍（模拟：平均 0.95 对 0.35 单位，95% 情况下最大 2.0 对 0.8）。
calibration-clicks: 3

# 菜单打开期间隐藏经验条和等级（默认开启）：只对本人发包，让生存/冒险玩家的客户端以为处于创造模式；
# 服务器的模式不变，移动、掉落、水流、载具照常由客户端计算，关闭时补发真实模式与飞行能力。
# 附近有路标（定位栏 locator_bar）或骑可跳跃坐骑时，那一行改画定位栏/跳跃条，本项无法隐藏。
hide-experience-bar: true

# 用 HUD 插件的准星替换原版准星（默认关闭）：开启后导出资源包里原版准星图为透明，lumamenu:crosshair 为浅灰同形十字；
# 关闭时该字体透明且零宽，原版准星不变。需由 HUD 插件（如 CustomNameplates 动作栏）常驻发送（YAML 双引号写法）：
#   "<font:lumamenu:crosshair><#FC04F8>\uE000\uE001</#FC04F8></font>"
# U+E000 为准星，U+E001 回退准星的字宽，不改变动作栏宽度；不要加粗或带阴影色。资源包着色器把它画在屏幕正中，
# 菜单打开期间插件从该玩家收到的动作栏里删掉这段文字，准星随之消失。修改后 reload 并按资源包流程重新合包。
replace-crosshair: false
